<!--[cite: 2] をベースに、課題部分を整理 -->
<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>キャンカレ</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">Can</span>

        <div><strong>キャンカレ</strong>
          <p><span>授業管理</span>
        </div>
        </p>

      </div>
      <nav class="nav-list">
        <a class="nav-item active" data-view="home" href="#home">ホーム</a>
        <a class="nav-item" data-view="timetable" href="#timetable">時間割</a>
        <a class="nav-item" data-view="changes" href="#changes">変更追加</a>
        <a class="nav-item" data-view="tasks" href="#tasks">課題</a>
        <a class="nav-item" data-view="tests" href="#tests">テスト</a>
        <a class="nav-item" data-view="settings" href="#settings">設定</a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="todayDateLabel"></p>
          <h1 id="viewTitle">ホーム</h1>
        </div>
      </header>

      <!-- ホーム[cite: 2] -->
      <section class="view active" id="home">
        <div class="dashboard">
          <section class="panel today-panel">
            <div class="panel-heading">
              <h2>今日の授業</h2>
            </div>
            <div class="lesson-list" id="todayLessons"></div>
          </section>
          <section class="panel">
            <div class="panel-heading">
              <h2>締切が近い課題</h2>
            </div>
            <div id="homeTasks"></div>
          </section>
        </div>
      </section>

      <!-- 時間割[cite: 2] -->
      <section class="view" id="timetable">
        <section class="toolbar">
          <button class="secondary-action" id="addLessonButton" type="button">授業を追加</button>
        </section>
        <div class="timetable" id="timetableGrid"></div>
      </section>

      <!-- 変更追加[cite: 2] -->
      <section class="view" id="changes">
        <div class="change-layout">
          <section class="panel">
            <div class="panel-heading">
              <h2>変更・授業追加</h2>
            </div>
            <textarea id="changeText" rows="9" placeholder="例文:
振替: 5月10日 2限 英語A 振替 金曜日
休講: 5月10日 2限 英語A 休講">例文:　追加　5月10日 2限 英語A 休講</textarea>
            <div style="display:flex; gap:8px; margin-top:8px;">
              <button id="exampleTransfer" class="secondary-action" type="button">振替例文</button>
              <button id="exampleSchedule" class="secondary-action" type="button">授業追加例文</button>
              <button id="exampleCancel" class="secondary-action" type="button">休講例文</button>
              <button id="exampleDelete" class="secondary-action" type="button">削除例文</button>
            </div>
            <button class="primary-action" id="analyzeButton" type="button">解析する</button>
          </section>
          <section class="panel">
            <div id="changePreview"></div>
            <button class="primary-action" id="applyChangeButton" disabled>反映する</button>
            <div id="transferFields" style="display:none; margin-top:20px;">
              <div style="display:flex; gap:12px; margin-bottom:12px;">
                <label><input type="radio" name="changeMode" value="edit" checked> 変更/追加</label>
                <label><input type="radio" name="changeMode" value="transfer"> 振替</label>
              </div>
              <div style="display:grid; gap:12px;">
                <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:center;">
                  <div><strong>移動元</strong><br>
                    <select id="transferSourceDay"></select>
                  </div>
                  <div><strong>移動先</strong><br>
                    <select id="transferTargetDay"></select>
                  </div>
                </div>
                <div>
                  <label for="transferLesson">振替する授業</label><br>
                  <select id="transferLesson" style="width:100%; min-height:40px;"></select>
                </div>
                <button class="primary-action" id="transferButton" type="button">振替する</button>
                <div id="transferStatus" style="color:#506977; font-size:14px;"></div>
              </div>
            </div>
          </section>
        </div>
      </section>

      <!-- 課題（ここを1つに統合） -->
      <section class="view" id="tasks">
        <button id="addTaskButton" class="primary-action" style="width:100%; margin-bottom:20px;">＋ 課題を追加</button>
        <div id="taskList">
          <p class="empty-message">課題無し</p>
        </div>
      </section>

      <!-- テスト -->
      <section class="view" id="tests">
        <button id="addTestButton" class="primary-action" style="width:100%; margin-bottom:20px;">＋ テストを追加</button>
        <div id="testList">
          <p class="empty-message">テスト無し</p>
        </div>
      </section>

      <!-- 設定[cite: 2] -->
      <section class="view" id="settings">
        <section class="panel">
          <div id="periodSettings"></div>
        </section>
      </section>
    </main>
  </div>

  <!-- 課題ダイアログ -->
  <dialog id="taskDialog">
    <form id="taskForm" method="dialog">
      <h3>課題の登録</h3>
      <input type="text" name="taskName" placeholder="内容" required style="width:100%; margin-bottom:10px;">
      <div style="display:flex; gap:10px;">
        <input type="date" name="taskDate" required style="flex:1;">
        <input type="text" name="taskRoom" placeholder="教室" style="flex:1;">
      </div>
      <input type="text" name="taskSubmission" placeholder="提出方法" style="width:100%; margin:10px 0;">
      <div class="button-row">
        <button type="button" class="secondary-action" id="cancelTaskButton">キャンセル</button>
        <button type="submit" class="primary-action">保存</button>
      </div>
    </form>
  </dialog>

  <!-- テストダイアログ -->
  <dialog id="testDialog">
    <form id="testForm" method="dialog">
      <h3>テストの登録</h3>
      <input type="text" name="testName" placeholder="内容" required style="width:100%; margin-bottom:10px;">
      <div style="display:flex; gap:10px;">
        <input type="date" name="testDate" required style="flex:1;">
        <input type="text" name="testRoom" placeholder="教室" style="flex:1;">
      </div>
      <div class="button-row">
        <button type="button" class="secondary-action" id="cancelTestButton">キャンセル</button>
        <button type="submit" class="primary-action">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 課題編集ダイアログ -->
  <dialog id="editTaskDialog">
    <form id="editTaskForm" method="dialog">
      <h3>課題の編集</h3>
      <input type="hidden" name="editTaskId" id="editTaskId">
      <input type="text" name="editTaskName" id="editTaskName" placeholder="内容" required
        style="width:100%; margin-bottom:10px;">
      <div style="display:flex; gap:10px;">
        <input type="date" name="editTaskDate" id="editTaskDate" required style="flex:1;">
        <input type="text" name="editTaskRoom" id="editTaskRoom" placeholder="教室" style="flex:1;">
      </div>
      <input type="text" name="editTaskSubmission" id="editTaskSubmission" placeholder="提出方法"
        style="width:100%; margin:10px 0;">
      <div class="button-row">
        <button type="button" class="secondary-action" id="cancelEditTaskButton">キャンセル</button>
        <button type="submit" class="primary-action">保存</button>
      </div>
    </form>
  </dialog>

  <!-- テスト編集ダイアログ -->
  <dialog id="editTestDialog">
    <form id="editTestForm" method="dialog">
      <h3>テストの編集</h3>
      <input type="hidden" name="editTestId" id="editTestId">
      <input type="text" name="editTestName" id="editTestName" placeholder="内容" required
        style="width:100%; margin-bottom:10px;">
      <div style="display:flex; gap:10px;">
        <input type="date" name="editTestDate" id="editTestDate" required style="flex:1;">
        <input type="text" name="editTestRoom" id="editTestRoom" placeholder="教室" style="flex:1;">
      </div>
      <div class="button-row">
        <button type="button" class="secondary-action" id="cancelEditTestButton">キャンセル</button>
        <button type="submit" class="primary-action">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 授業追加ダイアログ -->
  <dialog id="lessonDialog">
    <form id="lessonForm" method="dialog">
      <h3>授業の追加</h3>
      <input id="lessonName" type="text" name="lessonName" placeholder="授業名" required
        style="width:100%; margin-bottom:10px;">
      <div style="display:flex; gap:10px; margin-bottom:10px;">
        <select id="lessonDay" name="lessonDay" required style="flex:1;">
          <option value="">曜日を選択</option>
          <option value="月">月</option>
          <option value="火">火</option>
          <option value="水">水</option>
          <option value="木">木</option>
          <option value="金">金</option>
        </select>
        <select id="lessonPeriod" name="lessonPeriod" required style="flex:1;">
          <option value="">時限を選択</option>
          <option value="1">1限</option>
          <option value="2">2限</option>
          <option value="3">3限</option>
          <option value="4">4限</option>

        </select>
      </div>
      <input id="lessonRoom" type="text" name="lessonRoom" placeholder="教室" style="width:100%; margin-bottom:10px;">
      <div class="button-row">
        <button type="button" class="secondary-action" id="cancelLessonButton">キャンセル</button>
        <button type="submit" class="primary-action">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 授業編集ダイアログ -->
  <dialog id="editLessonDialog">
    <form id="editLessonForm">
      <h3>授業の編集</h3>
      <input type="hidden" name="editLessonId" id="editLessonId">
      <input type="text" name="editLessonName" id="editLessonName" placeholder="授業名" required
        style="width:100%; margin-bottom:10px;">
      <div style="display:flex; gap:10px; margin-bottom:10px;">
        <select name="editLessonDay" id="editLessonDay" required style="flex:1;">
          <option value="">曜日を選択</option>
          <option value="月">月</option>
          <option value="火">火</option>
          <option value="水">水</option>
          <option value="木">木</option>
          <option value="金">金</option>
        </select>
        <select name="editLessonPeriod" id="editLessonPeriod" required style="flex:1;">
          <option value="">時限を選択</option>
          <option value="1">1限</option>
          <option value="2">2限</option>
          <option value="3">3限</option>
          <option value="4">4限</option>

        </select>
      </div>
      <input type="text" name="editLessonRoom" id="editLessonRoom" placeholder="教室"
        style="width:100%; margin-bottom:10px;">
      <div class="button-row">
        <button type="button" class="secondary-action" id="cancelEditLessonButton">キャンセル</button>
        <button type="submit" class="primary-action">保存</button>
      </div>
    </form>
  </dialog>

  <script src="./app.js"></script>
</body>

</html>
